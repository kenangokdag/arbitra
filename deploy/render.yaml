services:
  - type: web
    name: papermind-api
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      # ── APP ───────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: APP_LOG_LEVEL
        value: INFO

      # ── Supabase (dashboard'dan gir) ───────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # 2026-04-30 canon: JWKS (ES256). HS256 JWT_SECRET legacy/test fallback.
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Migration apply job için (scripts/apply_migrations.sh)
      - key: SUPABASE_DB_URL
        sync: false

      # ── Pinecone (dashboard'dan gir) ───────────────────────────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: papers-bgem3
      - key: PINECONE_NAMESPACE
        value: mdv1
      - key: PINECONE_DIMENSION
        value: 1024
      - key: PINECONE_METRIC
        value: cosine

      # ── Redis (managed; fromService inject) ────────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: papermind-redis
          property: connectionString

      # ── Gemini (dashboard'dan gir) — F8 DM-LLM-1 ───────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro

      # ── OpenAlex polite pool ───────────────────────────────────────────
      - key: OPENALEX_EMAIL
        value: dr.ofrencber@gaziantep.edu.tr

      # ── Sentry (dashboard'dan gir) ─────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1

      # ── Waitlist gate (prod = false, dev/test = true) ──────────────────
      - key: WAITLIST_BYPASS
        value: false

      # ── ⚠️ DEMO/BETA GEÇİCİ (2026-08-27, Kenan onayı) ────────────────────
      # FE'de gerçek Supabase login yok (web/src/lib/auth.ts sahte JWT üretiyor).
      # true iken imza doğrulaması ATLANIR (bkz api/middleware/auth.py DEMO_AUTH_BYPASS,
      # api/config.py DEMO_AUTH_BYPASS). Gerçek login bağlanınca false yapılıp satır silinmeli.
      - key: DEMO_AUTH_BYPASS
        value: true

      # ── ⛔ PROD-FATAL: CORS — BOŞ ise config_validation boot REDDEDER ────
      # (api/config_validation.py). Dashboard'dan gir: https://FE_DOMAIN (virgülle çoklu).
      - key: FRONTEND_ORIGINS
        sync: false

      # ── Admin paneli (tema/işler/istatistik) — boş = uçlar fail-closed kapalı ──
      - key: ADMIN_USER_IDS
        sync: false

      # ── F14 review IZOLE Supabase (Clarus) — boş = default SUPABASE_* ───
      - key: REVIEW_SUPABASE_URL
        sync: false
      - key: REVIEW_SUPABASE_SECRET_KEY
        sync: false

      # ── Claude fallback (LLM arıza yolu, opsiyonel) ─────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Model warm-up (512MB RAM aşımını engellemek için false yapıldı) ──
      - key: BGE_WARMUP_ENABLED
        value: false

      # ── Rate limit ────────────────────────────────────────────────────
      - key: RATE_LIMIT_OGRENCI_PER_MIN
        value: 60

  - type: redis
    name: papermind-redis
    # 2026-08-24 düzeltme: bu servis diğer TÜM servislerin (web + 7 cron,
    # hepsi region: frankfurt) aksine bölge belirtmiyordu — Render'ın
    # varsayılan bölgesine düşmüş olabilir, bu da web servisinin özel
    # iç ağından (aynı bölge gerektirir) erişilemez internal hostname'e
    # yol açar. Prod log kanıtı: "Error -2 connecting to
    # red-da44gvgae00c739lk04g:6379, Name or service not known" (DNS
    # çözümlenemiyor). Şu an fail-open (cache kapalı, site çökmüyor)
    # ama düzeltilmeli.
    region: frankfurt
    plan: starter
    ipAllowList: []

  # ── F13-S14 Cron Jobs ──────────────────────────────────────────────────
  - type: cron
    name: papermind-cron-completion-delete-expired
    env: python
    region: frankfurt
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.completion_delete_expired
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: cron
    name: papermind-cron-review-retention-delete-expired
    env: python
    region: frankfurt
    plan: starter
    schedule: "30 4 * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.review_retention_delete_expired
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: REVIEW_SUPABASE_URL
        sync: false
      - key: REVIEW_SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: cron
    name: papermind-cron-diary-unresolved-weekly
    env: python
    region: frankfurt
    plan: starter
    schedule: "0 9 * * 1"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.diary_unresolved_weekly
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: cron
    name: papermind-cron-diary-monthly-digest
    env: python
    region: frankfurt
    plan: starter
    schedule: "0 8 1 * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.diary_monthly_digest
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: cron
    name: papermind-cron-method-centrality-refresh
    env: python
    region: frankfurt
    plan: starter
    schedule: "0 3 * * 0"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.method_centrality_refresh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: cron
    name: papermind-cron-neighbor-bibcoupling-refresh
    env: python
    region: frankfurt
    plan: starter
    schedule: "30 3 * * 0"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.neighbor_bibcoupling_refresh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  - type: cron
    name: papermind-cron-health-heartbeat
    env: python
    region: frankfurt
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.cron.health_heartbeat
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: PAPERMIND_API_BASE
        value: https://papermind-api-l3ou.onrender.com
